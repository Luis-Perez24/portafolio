server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml font/woff2;

    location / {
        try_files $uri $uri/ =404;
    }

    # Fuentes e imágenes: nombre estable, cache larga
    location ~* \.(?:css|js|woff2|svg|png|jpg|jpeg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /404.html {
        internal;
    }
}
